[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[project]
name = "multicosim"
version = "0.3.0"
description = "Multi-component simulation definition framework"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["simulation"]
authors = [
    { name = "Quinn Thibeault", email = "quinn.thibeault96@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "attrs>=24.1.0",
    "docker>=7.1.0",
    "nanoid>=2.0.0",
    "numpy>=1.26.4",
    "pyzmq>=27.1.0",
    "typing-extensions>=4.15.0",
    "unique-namer>=1.6.2",
]

[project.urls]
documentation = "https://github.com/cpslab-asu/multicosim#readme"
issues = "https://github.com/cpslab-asu/multicosim/issues"
source = "https://github.com/cpslab-asu/multicosim"

[dependency-groups]
dev = [
    "nox>=2025.5.1",
    "nox-uv>=0.7.1",
]
test = [
    "pytest>=8.4.2",
]
examples = [
    "click>=8.1.8",
    "multicosim-rover-controller",
]
types = [
    "mypy>=1.19.1",
    "types-docker>=7.1.0.20260109",
    "zuban>=0.7.2",
]
lint = [
    "ruff>=0.15.12",
]

[tool.uv]
default-groups = ["dev", "lint", "types", "test", "examples"]

[tool.uv.sources]
multicosim-rover-controller = { path = "./examples/rover/controller" }

[tool.uv.workspace]
members = ["px4", "gazebo"]

[tool.ruff]
line-length = 100
indent-width = 4
include = [
    "pyproject.toml",
    "noxfile.py",
    "src/**/*.py",
    "stubs/**/*.pyi",
    "tests/**/*.py",
    "examples/**/*.py",
    "gazebo/src/*.py",
    "ardupilot/src/*.py",
    "px4/src/*.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "C90",  # Default Flake8 lints
    "A",                           # Built-in shadowing lints
    "B",                           # Bugbear lints
    "I",                           # Isort lints
    "UP",                          # Upgrade lints
    "C4",                          # List comprehension lints
    "PYI",                         # Stub file lints
    "RET501", "RET502", "RET504",  # Return value lints
    "N8",                          # Naming plugin
    "TD",                          # TODO plugin
    "FBT",                         # Boolean trap lints
    "SIM",                         # Simplification lints
    "PTH",                         # Pathlib migration lints
]

[tool.ruff.lint.isort]
known-first-party = ["multicosim"]
split-on-trailing-comma = false

[tool.pytest.ini_options]
markers = ["integration"]

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]
venvPath = "."
venv = ".venv"
stubPath = "stubs"

[tool.mypy]
python_version = "3.10"
mypy_path = "stubs"
files = [
    "src/**/*.py",
    "stubs/**/*.pyi",
    "tests/**/*.py",
    "examples/**/*.py",
    "gazebo/src/*.py",
    "px4/src/*.py",
    "ardupilot/src/*.py",
]

[tool.zuban]
python_version = "3.10"
mypy_path = "stubs"
mode = "default"
strict = true
untyped_function_return_mode = "inferred"
files = [
    "src/**/*.py",
    "stubs/**/*.pyi",
    "tests/**/*.py",
    "examples/**/*.py",
    "gazebo/src/*.py",
    "px4/src/*.py",
    "ardupilot/src/*.py",
]
