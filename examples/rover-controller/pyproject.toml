[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[project]
name = "multicosim-rover-controller"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "numpy~=1.26.0"
]

[dependency-groups]
container = [
    "apscheduler~=3.11",
    "click~=8.1",
    "pyzmq~=26.2",
]

[tool.uv.build-backend]
module-name = "roverctl"
